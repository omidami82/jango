<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}هم‌آوا{% endblock %}</title>
    <!-- لینک بوت‌استرپ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- هدر سایت -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'computer:home' %}">هم‌آوا</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'computer:home' %}">خانه</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'computer:professor_list' %}">اساتید</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/">پنل ادمین</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی صفحات -->
    <main class="container my-4 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- فوتر -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>© دانشگاه ارومیه - سامانه هم‌آوا</small>
        </div>
    </footer>

    <!-- اسکریپت بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
